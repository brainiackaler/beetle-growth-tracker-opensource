server.port=${PORT:8088}

# Local-first default. Override these three values for MySQL/TiDB.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/beetle_growth;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

app.jwt.secret=${JWT_SECRET}
app.registration.enabled=${REGISTRATION_ENABLED:true}

storage.supabase.url=${STORAGE_SUPABASE_URL:}
storage.supabase.bucket=${STORAGE_SUPABASE_BUCKET:}
storage.supabase.key=${STORAGE_SUPABASE_KEY:}

notification.bark.icon-url=${BARK_ICON_URL:}

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET:}
telegram.webhook.url=${TELEGRAM_WEBHOOK_URL:}
telegram.api.proxy-url=${TELEGRAM_API_PROXY_URL:}
telegram.api.proxy-secret=${TELEGRAM_API_PROXY_SECRET:}
